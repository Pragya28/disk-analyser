name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        # add ubuntu-latest in Phase 15, windows-latest in Phase 14
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
